<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandboxed preview iframe
      if (typeof window !== 'undefined') {
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function (...args) {
          if (args.some(a => typeof a === 'string' && (a.includes('[vite]') || a.includes('WebSocket')))) return;
          origWarn.apply(console, args);
        };
        console.error = function (...args) {
          if (args.some(a => typeof a === 'string' && (a.includes('[vite]') || a.includes('WebSocket')))) return;
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function (e) {
          if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('[vite]'))) {
            e.preventDefault();
          }
        });
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CAPP - Chat App</title>
    <meta name="description" content="CAPP Chat, Channels and Build Lab" />

    <!-- Android PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAPP" />
    <meta name="application-name" content="CAPP" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Social & OpenGraph -->
    <meta property="og:title" content="CAPP AI — Think smarter. Create more." />
    <meta property="og:description" content="An intelligent AI assistant for conversation, creativity, learning, coding and more." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white">

</html>
