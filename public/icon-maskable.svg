<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="mCGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="mCoreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background for Android maskable canvas (edge-to-edge) -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Centered inside 80% Safe Zone (radius ~180px safe center) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Ambient Light Pulse -->
    <circle cx="256" cy="256" r="160" fill="url(#mCoreGlow)" opacity="0.18" filter="url(#mGlow)"/>

    <!-- Outer Sculpted C -->
    <path d="M 360,150 
             A 140,140 0 1,0 360,362 
             L 326,322 
             A 92,92 0 1,1 326,190 
             Z" 
          fill="url(#mCGrad)"/>

    <!-- Inner Intelligence Spark / Core -->
    <circle cx="346" cy="256" r="28" fill="url(#mCoreGlow)" filter="url(#mGlow)"/>
    <circle cx="346" cy="256" r="16" fill="#ffffff"/>

    <!-- Top and bottom dynamic geometric cuts -->
    <circle cx="343" cy="170" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="343" cy="342" r="10" fill="#94a3b8" opacity="0.7"/>
  </g>
</svg>
