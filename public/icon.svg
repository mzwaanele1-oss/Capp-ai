<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#262626" stroke-width="2" opacity="0.6"/>

  <!-- Ambient Light Pulse -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" opacity="0.12" filter="url(#glow)"/>

  <!-- Outer Sculpted C -->
  <path d="M 360,150 
           A 140,140 0 1,0 360,362 
           L 326,322 
           A 92,92 0 1,1 326,190 
           Z" 
        fill="url(#cGrad)"/>

  <!-- Inner Intelligence Spark / Core -->
  <circle cx="346" cy="256" r="28" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="346" cy="256" r="16" fill="#ffffff"/>

  <!-- Top and bottom dynamic geometric cuts -->
  <circle cx="343" cy="170" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="343" cy="342" r="10" fill="#94a3b8" opacity="0.7"/>
</svg>
