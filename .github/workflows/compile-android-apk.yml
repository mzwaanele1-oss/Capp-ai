name: Compile Android APK (GitHub Actions)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: npm install

      - name: Compile and Build App
        run: npm run build

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Compile Android TWA Project
        run: |
          mkdir -p android-build
          cd android-build
          
          # Initialize Android TWA package configuration
          bubblewrap init --manifest="${GITHUB_WORKSPACE}/dist/manifest.json" \
            --chromeOSOnly=false \
            --packageId="com.capp.ai.app" \
            --appName="CAPP AI" \
            --shortName="CAPP" \
            --startUrl="/" \
            --themeColor="#000000" \
            --backgroundColor="#000000" \
            --iconUrl="${GITHUB_WORKSPACE}/dist/icons/Icon-512.png" \
            --maskableIconUrl="${GITHUB_WORKSPACE}/dist/icons/Icon-maskable-512.png" \
            --skipVersionCheck || true

          # If bubblewrap built the gradle project, build APK via Gradle wrapper or CLI
          if [ -f "build.gradle" ] || [ -f "settings.gradle" ]; then
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleDebug || bubblewrap build --skipPwaValidation || true
          fi
        continue-on-error: true

      - name: Check for Compiled APK files
        run: |
          mkdir -p output-apk
          find . -name "*.apk" -exec cp {} output-apk/ \; 2>/dev/null || true
          if [ -z "$(ls -A output-apk)" ]; then
            echo "Packaging standalone Web APK bundle..."
            mkdir -p output-apk/bundle
            cp -r dist/* output-apk/bundle/
            python3 scripts/export-zip.py output-apk/capp-ai-android-assets.zip
          fi
          ls -la output-apk/

      - name: Upload Android APK & Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capp-ai-android-apk
          path: output-apk/
          retention-days: 30
