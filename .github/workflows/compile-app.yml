name: Compile & Build CAPP AI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: npm install

      - name: Generate High-Resolution Icons
        run: npm run generate:icons

      - name: Typecheck and Lint
        run: npm run lint

      - name: Compile and Build App
        run: npm run build
        env:
          NODE_ENV: production

      - name: Export Project Archive
        run: python3 scripts/export-zip.py dist/capp-ai-project.zip

      - name: Upload Compiled Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capp-ai-web-build
          path: dist/
          retention-days: 30

      - name: Upload Project Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: capp-ai-project-archive
          path: dist/capp-ai-project.zip
          retention-days: 30
